<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Rakitin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="auth-container">

    <div class="auth-logo">Rakitin<span>.</span></div>

    <p class="auth-subtitle">Sewa alat, tinggal pakai.</p>

    <div class="auth-box">
        <h1>Buat Akun</h1>
        <p>Daftar untuk mulai menggunakan Rakitin.</p>

        <form>
            <label>Email</label>
            <input type="email" placeholder="Masukkan email" required>

            <label>Username</label>
            <input type="text" placeholder="Masukkan username" required>

            <label>Password</label>
            <input type="password" placeholder="Masukkan password" required>

            <button type="submit">Daftar Sekarang</button>
        </form>

        <p class="switch">
            Sudah punya akun?
            <a href="login.html">Login</a>
        </p>
    </div>

    <footer>
        <b>© Rakitin 2026</b>
    </footer>

</div>

</body>
</html>
